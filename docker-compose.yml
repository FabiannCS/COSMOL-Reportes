services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmol_reportes_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:16
    container_name: cosmol_reportes_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
    name: cosmol_reportes_pgdata

