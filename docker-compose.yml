services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmol_app
    ports:
      - 8080:80
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:16
    container_name: cosmol_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
